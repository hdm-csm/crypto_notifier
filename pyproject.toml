[tool.black]
line-length = 100
target-version = ['py312']
#replace the below than py312 because sometimes environment isn’t actually running Python 3.12, mypy will complain or behave incorrectly.
#target-version = ['py311']

# see flake8 config in .flake8 file

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false 
exclude = [
    '^venv/',
    '^\.venv/',
    '^build/',
    '^dist/',
    '^env/',
    '^\.git/',
    '^\.mypy_cache/',
]
